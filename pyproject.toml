[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "harnessbench"
version = "0.1.0"
description = "A reproducible benchmark for agent harnesses"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["jsonschema>=4.22"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
harnessbench = "harnessbench.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
